[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-processing-agent"
version = "1.0.0"
description = "智能文档处理 Agent 系统 - 基于 LangChain 和 LangGraph 的多智能体平台"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = [
    "agent",
    "langchain",
    "langgraph",
    "document-processing",
    "ocr",
    "rag",
    "fastapi",
    "kafka",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Web 框架
    "fastapi==0.135.3",
    "starlette==0.52.1",
    "uvicorn[standard]==0.44.0",
    "python-multipart>=0.0.6",
    
    # LangChain 生态系统
    "langchain==1.3.12",
    "langchain-core==1.4.9",
    "langchain-openai==1.3.4",
    "langchain-deepseek==1.0.1",
    "langchain-community==0.4.1",
    "langchain-text-splitters==1.1.1",
    
    # LangGraph 工作流编排
    "langgraph==1.2.8",
    "langgraph-checkpoint==4.1.1",
    "langgraph-checkpoint-sqlite==3.1.0",
    "langgraph-checkpoint-redis==0.4.0",
    "langgraph-prebuilt==1.1.0",
    "langgraph-sdk==0.4.2",
    "langchain-mcp-adapters==0.2.2",

    # MCP / SSE
    "fastmcp==3.2.0",
    "mcp==1.27.0",
    "PyJWT[crypto]>=2.10.1",
    
    # 数据验证
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "pydantic-extra-types>=2.10.0",
    
    # 数据库
    "sqlalchemy>=2.0.0",
    "aiomysql>=0.3.0",
    "pymysql>=1.1.0",
    "aiosqlite>=0.22.1",
    "redis==7.1.0",
    # 现有 Milvus 服务与 grpcio 1.82 握手不兼容，和生产运行环境保持一致
        "werkzeug>=3.0.0",
    
    # 消息队列
    
    # 对象存储
    "minio>=7.2.0",
    
    # HTTP 客户端
    "httpx>=0.28.0",
    "httpx-retries>=0.4.0",
    
    # 日志
    "loguru>=0.7.0",
    
    # 工具库
    "python-dotenv>=1.0.0",
    "shortuuid==1.0.13",
    "aiofiles>=23.0.0",
    "tenacity>=8.2.0",
    "orjson>=3.9.0",
    "agent-sandbox==0.0.30",
    "transformers>=4.42,<5",
    
    # 图像处理
    "pillow>=10.0.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "opencv-python-headless>=4.10,<5",
    
    # 图计算和数值计算
    "numpy>=1.21.0",
    "scipy>=1.15.0",
    "duckdb==1.5.3",
    
    # Token计数
    "tiktoken>=0.5.0",
    
    # 文档处理
    "python-docx>=1.1.0",
    "pypandoc_binary>=1.13",
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0",
    "openpyxl>=3.1",
    "markdown>=3.5.0",
    "markdownify>=1.2.0",
    "readabilipy>=0.3.0",
    
    # 向量数据库

    # 图数据库
    
    # 监控
    "prometheus-fastapi-instrumentator==7.1.0",
]

[project.optional-dependencies]
dev = [
    # 测试
    # 离线质量门禁并行执行（run_quality_gate.py -n；覆盖率跨 worker 合并）
    
    # 代码质量
    "black>=25.11.0",
    "flake8>=7.3.0",
    "isort>=5.13.0",
    "mypy>=1.19.0",
    "pre-commit>=3.6.0",
    
    # 类型检查
    "types-requests>=2.31.0",
    "types-aiofiles>=23.2.0",
]


docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

all = [
    "document-processing-agent[dev,test,docs]",
]

[project.urls]
Homepage = "https://github.com/yourusername/document-processing-agent"
Documentation = "https://document-processing-agent.readthedocs.io"
Repository = "https://github.com/yourusername/document-processing-agent.git"
Issues = "https://github.com/yourusername/document-processing-agent/issues"

[project.scripts]
doc-agent = "backend.cli:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = [
    "*.yaml",
    "*.yml",
    "*.json",
    "config/agents/*.yaml",
    "config/mcp/*.yaml",
    "config/prompts/*.yaml",
    "config/tools/*.yaml",
    "config/workflows/*.yaml",
    "skills/**/*",
]

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # 排除目录
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = false
skip = [".venv", "venv", "migrations"]

[tool.mypy]
python_version = "3.14"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
strict_optional = false
exclude = "(^backend/tests/|^backend/migrations/|^MinerU-master/|^lc-studylab-main/)"
disable_error_code = [
    "attr-defined",
    "arg-type",
    "call-arg",
    "union-attr",
    "var-annotated",
    "import-untyped",
    "misc",
]

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langgraph.*",
    "minio.*",
    "faiss.*",
]
ignore_missing_imports = true


[tool.coverage.run]
source = ["backend"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "migrations",
]
per-file-ignores = [
    "__init__.py:F401",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
