# Pre-commit 配置
# 在代码提交前自动运行检查工具

repos:
  # 代码格式化 - Black
  - repo: https://bgithub.xyz/psf/black
    rev: 25.11.0
    hooks:
      - id: black
        language_version: python3.10
        args: ['--line-length=88']

  # 导入排序 - isort
  - repo: https://bgithub.xyz/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile', 'black', '--line-length=88']

  # 代码检查 - flake8
  - repo: https://bgithub.xyz/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: ['--max-line-length=88', '--ignore=E203,W503,E501']
        additional_dependencies:
          - flake8-docstrings
          - flake8-bugbear
          - flake8-comprehensions

  # 类型检查 - mypy
  - repo: https://bgithub.xyz/pre-commit/mirrors-mypy
    rev: v1.19.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - types-aiofiles
          - pydantic>=2.0
        args: ['--ignore-missing-imports', '--no-strict-optional']
        exclude: ^(tests/|migrations/)

  # 文件排序 - pyproject-sort
  - repo: https://bgithub.xyz/andreoliwa/nitpick
    rev: 0.35.0
    hooks:
      - id: nitpick
        additional_dependencies:
          - toml-sort

  # YAML 格式化
  - repo: https://bgithub.xyz/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.13.0
    hooks:
      - id: pretty-format-yaml
        args: ['--autofix', '--indent', '2']

  # JSON 格式化
  - repo: https://bgithub.xyz/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.13.0
    hooks:
      - id: pretty-format-json
        args: ['--autofix', '--indent', '2']

  # 检查 YAML 语法
  - repo: https://bgithub.xyz/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ['-d', '{extends: default, rules: {line-length: {max: 120}}}']

  # 检查 JSON 语法
  - repo: https://bgithub.xyz/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # 安全性检查
  - repo: https://bgithub.xyz/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']

  # 依赖检查
  - repo: https://bgithub.xyz/Lucas-C/pre-commit-hooks-safety
    rev: v1.3.4
    hooks:
      - id: python-safety-dependencies-check
        files: 'requirements.*\.txt$|pyproject\.toml$'

  # 检查 Python 版本兼容性
  - repo: https://bgithub.xyz/asottile/pyupgrade
    rev: v3.15.2
    hooks:
      - id: pyupgrade
        args: ['--py310-plus']

  # 移除未使用的导入
  - repo: https://bgithub.xyz/hadialqattan/pycln
    rev: v2.4.0
    hooks:
      - id: pycln
        args: ['--all']

  # 检查代码复杂度
  - repo: https://bgithub.xyz/browniebroke/flake8-interactive
    rev: 1.0.0
    hooks:
      - id: flake8-interactive
        additional_dependencies:
          - flake8-cognitive-complexity
          - flake8-expression-complexity
