schema_id: nuclear_electronics
version: "1.0"
subject: nuclear_electronics
min_entity_confidence: 60
min_relation_confidence: 60
candidate_confidence: 40

entity_types:
  detector:
    description: 探测器、传感器或测量装置
    aliases: [探测器, 传感器, 测量装置, 设备]
  circuit:
    description: 电路、模块、芯片或读出系统
    aliases: [电路, 模块, 芯片, 读出系统, 组件, 前置放大器]
  isotope:
    description: 核素、放射源或粒子类型
    aliases: [核素, 放射源, 粒子]
  parameter:
    description: 能量、效率、分辨率、阈值等参数
    aliases: [参数, 能量, 效率, 分辨率, 阈值]
  material:
    description: 半导体、闪烁体、屏蔽材料等
    aliases: [材料, 半导体, 闪烁体, 屏蔽材料]
  method:
    description: 标定、滤波、重建、仿真等方法
    aliases: [方法, 标定, 滤波, 重建, 仿真]
  term:
    description: 其他专业术语
  term_cn:
    description: 其他中文专业术语
  model_or_code:
    description: 型号、编号、缩写或代码

relation_types:
  measures:
    description: 设备或方法测量对象/参数
    aliases: [测量, 探测, 测量对象]
    allowed_source_types: [detector, circuit, method]
    allowed_target_types: [isotope, parameter, term, term_cn]
    min_confidence: 65
  uses_material:
    description: 装置或方法使用某种材料
    aliases: [使用材料, 采用材料, 使用]
    allowed_source_types: [detector, circuit, method]
    allowed_target_types: [material]
    min_confidence: 65
  has_parameter:
    description: 实体具有某参数
    aliases: [具有参数, 参数]
    allowed_source_types: [detector, circuit, material, method, model_or_code]
    allowed_target_types: [parameter]
    min_confidence: 60
  improves:
    description: 方法或模块改善某指标
    aliases: [改善, 提升, 提高]
    allowed_source_types: [method, circuit, detector]
    allowed_target_types: [parameter, term, term_cn]
    min_confidence: 70
  co_occurs:
    description: 同一 chunk 中共同出现的弱关联
    aliases: [共现, 共同出现, 相关]
    min_confidence: 50

forbidden_relations:
  contradicts_without_evidence
