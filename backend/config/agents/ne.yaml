code: ne
name: 核电子学智能助手
domain: nuclear-electronics
description: 面向核电子学领域的专业问答、检索和研究智能体
default_model: null
default_kb_ids: []
default_skills:
  - nuclear-electronics
  - general-table-analysis
stream_timeout_policy:
  stream_idle_timeout_seconds: 180
  model_round_idle_timeout_seconds: 180
  heartbeat_interval_seconds: 30
  incomplete_round_retry_max: 2
  normal_stream_total_timeout_seconds: 600
  deep_research_stream_timeout_seconds: 1800
  deep_research_idle_timeout_seconds: 600
  deep_research_finalize_idle_timeout_seconds: 300
  deep_research_finalize_grace_seconds: 300
  deep_research_task_stall_grace_seconds: 300
  recursion_limit: null
default_workflow: full
allowed_workflows:
  # 探索式研究的详解接口会显式选择 lightweight；普通问答默认使用 full。
  - lightweight
  - full
  - deep_research
  - plan_solve
  - multi_agent_parallel
  - multi_agent_alternating
prompt_profile: ne
tool_policy: ne_default
kb_policy: bound_or_selected
guardrail_policy: ne_domain_scope
ui_profile: ne
